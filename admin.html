<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin - ASCT</title>

    <style>

        body{
            font-family:Arial;
            background:#f5f5f5;
            margin:0;
            padding:20px;
        }

        h1{
            text-align:center;
            color:#004080;
        }

        .topbar{
            display:flex;
            gap:10px;
            justify-content:center;
            flex-wrap:wrap;
            margin-bottom:20px;
        }

        input{
            padding:12px;
            border-radius:10px;
            border:none;
            width:300px;
        }

        button{
            border:none;
            padding:12px 18px;
            border-radius:10px;
            cursor:pointer;
            font-weight:bold;
        }

        .export{
            background:#004080;
            color:white;
        }

        .csv{
            background:#008000;
            color:white;
        }

        .card{
            background:white;
            border-radius:20px;
            padding:20px;
            margin:15px auto;
            max-width:850px;
            box-shadow:0 5px 20px rgba(0,0,0,0.08);
        }
		
		.card{
			cursor:pointer;
			transition:0.25s;
		}

		.card:hover{
			transform:translateY(-3px);
		}

		.details{
			margin-top:20px;
			padding-top:20px;
			border-top:1px solid #ddd;
			display:none;
		}

		.details.active{
			display:block;
		}

		.details-grid{
			display:grid;
			grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
			gap:12px;
		}

		.details-box{
			background:#f5f7fb;
			padding:15px;
			border-radius:12px;
		}

        .card h2{
            margin-top:0;
            color:#004080;
        }

        .grid{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
            gap:10px;
        }

        .bloc{
            background:#f7f9fc;
            padding:12px;
            border-radius:12px;
        }

        .actions{
            margin-top:20px;
            display:flex;
            gap:10px;
            flex-wrap:wrap;
        }

        .delete{
            background:red;
            color:white;
        }

        .pdf{
            background:#004080;
            color:white;
        }

        .open{
            background:#00a86b;
            color:white;
        }

        .counter{
            text-align:center;
            margin-bottom:20px;
            font-size:18px;
            font-weight:bold;
            color:#444;
        }

        @media(max-width:700px){

            .topbar{
                flex-direction:column;
                align-items:center;
            }

            input{
                width:100%;
                max-width:400px;
            }

        }

    </style>
</head>

<body>

<h1>🎿 Administration ASCT</h1>

<div class="counter" id="counter">
    0 inscription
</div>

<div class="topbar">

    <input id="search" placeholder="Rechercher un participant...">

    <button id="exportPDF" class="export">
        📄 Export PDF
    </button>

    <button id="exportCSV" class="csv">
        📊 Export CSV
    </button>

</div>

<div id="liste"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script type="module">

// =========================
// MOT DE PASSE
// =========================

const password = prompt("Mot de passe admin :");

if(password !== "ASCT2025"){

    document.body.innerHTML =
        "<h1>⛔ Accès refusé</h1>";

    throw new Error("Accès refusé");
}

// =========================
// FIREBASE
// =========================

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";

import {
    getFirestore,
    collection,
    onSnapshot,
    deleteDoc,
    doc
}
from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

const firebaseConfig = {

    apiKey: "AIzaSy...",
    authDomain: "asct-ski.firebaseapp.com",
    projectId: "asct-ski",
    storageBucket: "asct-ski.firebasestorage.app",
    messagingSenderId: "845391150142",
    appId: "1:845391150142:web:c7d808016344cfafad256f"
};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

// =========================
// HTML
// =========================

const liste =
    document.getElementById("liste");

const searchInput =
    document.getElementById("search");

const exportPDF =
    document.getElementById("exportPDF");

const exportCSV =
    document.getElementById("exportCSV");

const counter =
    document.getElementById("counter");

// =========================
// DATA
// =========================

let allData = [];

// =========================
// AFFICHAGE
// =========================

function afficherListe(dataArray){

    liste.innerHTML = "";

    counter.innerHTML =
        `${dataArray.length} inscription(s)`;

    dataArray.forEach(person => {

        const card =
            document.createElement("div");

        card.classList.add("card");

        card.innerHTML = `

            <h2>
                ${person.prenom || ""} ${person.nom || ""}
            </h2>

            <div class="grid">

                <div class="bloc">
                    <strong>📧 Email</strong><br>
                    ${person.email || "-"}
                </div>

                <div class="bloc">
                    <strong>📱 Téléphone</strong><br>
                    ${person.telephone || "-"}
                </div>

                <div class="bloc">
                    <strong>🎂 Naissance</strong><br>
                    ${person.dateNaissance || "-"}
                </div>

                <div class="bloc">
                    <strong>⛷️ Niveau ski</strong><br>
                    ${person.niveauSki || "-"}
                </div>

                <div class="bloc">
                    <strong>🏂 Niveau snow</strong><br>
                    ${person.niveauSnow || "-"}
                </div>

                <div class="bloc">
                    <strong>🚨 Contact urgence</strong><br>
                    ${person.contactUrgence || "-"}
                </div>

                <div class="bloc">
                    <strong>🩺 Allergies</strong><br>
                    ${person.allergies || "-"}
                </div>

                <div class="bloc">
                    <strong>💊 Traitement</strong><br>
                    ${person.traitement || "-"}
                </div>

            </div>

                <div class="details">

					<div class="details-grid">

						<div class="details-box">
							<strong>Adresse</strong><br>
							${person.adresse || "-"}
						</div>

						<div class="details-box">
							<strong>Contact urgence</strong><br>
							${person.contactUrgence || "-"}
						</div>

						<div class="details-box">
							<strong>Téléphone urgence</strong><br>
							${person.telephoneUrgence || "-"}
						</div>

						<div class="details-box">
							<strong>Lien urgence</strong><br>
							${person.lienUrgence || "-"}
						</div>

						<div class="details-box">
							<strong>Traitement</strong><br>
							${person.traitement || "-"}
						</div>

						<div class="details-box">
							<strong>Détails traitement</strong><br>
							${person.detailsTraitement || "-"}
						</div>

						<div class="details-box">
							<strong>Allergies</strong><br>
							${person.allergies || "-"}
						</div>

						<div class="details-box">
							<strong>Antécédents</strong><br>
							${person.antecedents || "-"}
						</div>

						<div class="details-box">
							<strong>Recommandations</strong><br>
							${person.recommandations || "-"}
						</div>

						<div class="details-box">
							<strong>Groupe sanguin</strong><br>
							${person.groupeSanguin || "-"}
						</div>

						<div class="details-box">
							<strong>Médecin</strong><br>
							${person.medecin || "-"}
						</div>

						<div class="details-box">
							<strong>Droit à l'image</strong><br>
							${person.droitImage || "-"}
						</div>

					</div>

				</div>

				<div class="actions">

					<button class="pdf">
						📄 PDF individuel
					</button>

					<button class="delete">
						🗑️ Supprimer
					</button>

				</div>
			`;

        // =========================
        // DELETE
        // =========================

        card.querySelector(".delete")
        .addEventListener("click", async () => {

            const confirmDelete =
                confirm("Supprimer l'inscription ?");

            if(confirmDelete){

                await deleteDoc(
                    doc(db, "inscriptions", person.id)
                );
            }
        });

        // =========================
		// PDF INDIVIDUEL PREMIUM
		// =========================

		card.querySelector(".pdf")
		.addEventListener("click", async () => {

			const { jsPDF } = window.jspdf;

			const pdf = new jsPDF({
				orientation: "portrait",
				unit: "mm",
				format: "a4"
			});

			// =====================================================
			// CONFIGURATION
			// =====================================================

			const PAGE_WIDTH = 210;
			const PAGE_HEIGHT = 297;

			const MARGIN_LEFT = 15;
			const MARGIN_RIGHT = 15;

			const CONTENT_WIDTH =
				PAGE_WIDTH - MARGIN_LEFT - MARGIN_RIGHT;

			let y = 0;

			// =====================================================
			// OUTILS
			// =====================================================

			function safe(value) {

				if (
					value === undefined ||
					value === null ||
					value === ""
				) {
					return "-";
				}

				return String(value);
			}


			function addPageHeader() {

				// Bandeau supérieur
				pdf.setFillColor(24, 45, 70);

				pdf.rect(
					0,
					0,
					PAGE_WIDTH,
					32,
					"F"
				);

				// Logo
				const logo = new Image();

				logo.src = "logo.png";

				try {

					pdf.addImage(
						logo,
						"PNG",
						15,
						5,
						22,
						22
					);

				} catch (error) {

					console.warn(
						"Logo impossible à charger",
						error
					);

				}

				// Nom club
				pdf.setTextColor(255, 255, 255);

				pdf.setFont(
					"helvetica",
					"bold"
				);

				pdf.setFontSize(16);

				pdf.text(
					"ASCT SKI COMPÉTITION",
					43,
					13
				);

				pdf.setFont(
					"helvetica",
					"normal"
				);

				pdf.setFontSize(9);

				pdf.text(
					"Fiche individuelle d'inscription",
					43,
					20
				);

				pdf.text(
					"Saison 2025 / 2026",
					43,
					26
				);

				y = 42;
			}


			function addFooter() {

				const pageCount =
					pdf.internal.getNumberOfPages();

				const currentPage =
					pdf.internal.getCurrentPageInfo().pageNumber;

				pdf.setDrawColor(210, 210, 210);

				pdf.line(
					MARGIN_LEFT,
					283,
					PAGE_WIDTH - MARGIN_RIGHT,
					283
				);

				pdf.setFont(
					"helvetica",
					"normal"
				);

				pdf.setFontSize(7);

				pdf.setTextColor(120, 120, 120);

				pdf.text(
					"ASCT Ski Compétition",
					MARGIN_LEFT,
					289
				);

				pdf.text(
					"asct.skicompetition@gmail.com • 06 73 28 83 97",
					PAGE_WIDTH / 2,
					289,
					{
						align: "center"
					}
				);

				pdf.text(
					`Page ${currentPage} / ${pageCount}`,
					PAGE_WIDTH - MARGIN_RIGHT,
					289,
					{
						align: "right"
					}
				);
			}


			function checkPageSpace(height = 20) {

				if (
					y + height >
					275
				) {

					addFooter();

					pdf.addPage();

					addPageHeader();
				}
			}


			function addSectionTitle(title, icon = "") {

				checkPageSpace(14);

				pdf.setFillColor(
					238,
					243,
					247
				);

				pdf.roundedRect(
					MARGIN_LEFT,
					y,
					CONTENT_WIDTH,
					9,
					2,
					2,
					"F"
				);

				pdf.setTextColor(
					24,
					45,
					70
				);

				pdf.setFont(
					"helvetica",
					"bold"
				);

				pdf.setFontSize(10);

				pdf.text(
					`${icon} ${title}`,
					MARGIN_LEFT + 4,
					y + 6
				);

				y += 14;
			}


			function addField(
				label,
				value,
				x,
				width,
				height = 12
			) {

				pdf.setDrawColor(
					220,
					225,
					230
				);

				pdf.setFillColor(
					250,
					251,
					252
				);

				pdf.roundedRect(
					x,
					y,
					width,
					height,
					2,
					2,
					"FD"
				);

				pdf.setFont(
					"helvetica",
					"bold"
				);

				pdf.setFontSize(7);

				pdf.setTextColor(
					110,
					110,
					110
				);

				pdf.text(
					label.toUpperCase(),
					x + 3,
					y + 4
				);

				pdf.setFont(
					"helvetica",
					"normal"
				);

				pdf.setFontSize(9);

				pdf.setTextColor(
					30,
					30,
					30
				);

				const lines =
					pdf.splitTextToSize(
						safe(value),
						width - 6
					);

				pdf.text(
					lines,
					x + 3,
					y + 8
				);
			}


			function addRow(
				label,
				value
			) {

				checkPageSpace(10);

				pdf.setFont(
					"helvetica",
					"bold"
				);

				pdf.setFontSize(8);

				pdf.setTextColor(
					90,
					90,
					90
				);

				pdf.text(
					label,
					MARGIN_LEFT + 3,
					y
				);

				pdf.setFont(
					"helvetica",
					"normal"
				);

				pdf.setTextColor(
					30,
					30,
					30
				);

				const lines =
					pdf.splitTextToSize(
						safe(value),
						CONTENT_WIDTH - 55
					);

				pdf.text(
					lines,
					MARGIN_LEFT + 55,
					y
				);

				y +=
					Math.max(
						6,
						lines.length * 4.5
					);
			}


			// =====================================================
			// CALCULS
			// =====================================================

			function getAge(dateNaissance) {

				if (!dateNaissance) {
					return null;
				}

				const birth =
					new Date(dateNaissance);

				if (
					isNaN(birth.getTime())
				) {
					return null;
				}

				const today =
					new Date();

				let age =
					today.getFullYear() -
					birth.getFullYear();

				const month =
					today.getMonth() -
					birth.getMonth();

				if (
					month < 0 ||
					(
						month === 0 &&
						today.getDate() < birth.getDate()
					)
				) {
					age--;
				}

				return age;
			}


			const age =
				getAge(person.dateNaissance);

			const typeParticipant =
				age !== null && age < 18
					? "Enfant"
					: "Adulte";


			// =====================================================
			// TARIF
			// =====================================================

			let statutTarif =
				person.safranStatus ||
				person.statutSafran ||
				person.safran ||
				"exterieur";

			statutTarif =
				String(statutTarif)
				.toLowerCase()
				.normalize("NFD")
				.replace(/[\u0300-\u036f]/g, "");

			if (
				statutTarif !== "salarie" &&
				statutTarif !== "retraite" &&
				statutTarif !== "exterieur"
			) {

				statutTarif = "exterieur";
			}


			let tarif = null;

			if (
				typeof TARIFS !== "undefined" &&
				TARIFS[typeParticipant.toLowerCase()]
			) {

				tarif =
					TARIFS[
						typeParticipant.toLowerCase()
					][statutTarif];
			}


			const forfaitLuz =
				person.npy === "oui" ||
				person.forfaitLuz === true;


			let montantTotal = 0;

			if (tarif) {

				montantTotal =
					Number(tarif.cotisation || 0);

				if (forfaitLuz) {

					montantTotal +=
						Number(
							tarif.forfaitLuz || 0
						);
				}
			}


			// =====================================================
			// HEADER
			// =====================================================

			addPageHeader();


			// =====================================================
			// IDENTITÉ
			// =====================================================

			addSectionTitle(
				"Participant",
				"👤"
			);

			const colWidth =
				(CONTENT_WIDTH - 6) / 2;

			addField(
				"Nom",
				person.nom,
				MARGIN_LEFT,
				colWidth
			);

			addField(
				"Prénom",
				person.prenom,
				MARGIN_LEFT + colWidth + 6,
				colWidth
			);

			y += 15;

			addField(
				"Date de naissance",
				person.dateNaissance,
				MARGIN_LEFT,
				colWidth
			);

			addField(
				"Catégorie",
				typeParticipant,
				MARGIN_LEFT + colWidth + 6,
				colWidth
			);

			y += 15;


			// =====================================================
			// COORDONNÉES
			// =====================================================

			addSectionTitle(
				"Coordonnées",
				"📞"
			);

			addRow(
				"Email",
				person.email
			);

			addRow(
				"Téléphone",
				person.telephone
			);

			addRow(
				"Adresse",
				person.adresse
			);


			// =====================================================
			// SITUATION
			// =====================================================

			addSectionTitle(
				"Situation",
				"🏢"
			);

			addRow(
				"Statut SAFRAN",
				person.safranStatus ||
				person.statutSafran ||
				person.safran
			);

			addRow(
				"QF",
				person.qf
			);

			addRow(
				"Service",
				person.service
			);

			addRow(
				"Correspondant",
				person.correspondant
			);


			// =====================================================
			// ACTIVITÉS
			// =====================================================

			addSectionTitle(
				"Activités",
				"⛷"
			);

			addRow(
				"Niveau ski",
				person.niveauSki
			);

			addRow(
				"Niveau snow",
				person.niveauSnow
			);

			addRow(
				"Encadrant",
				person.encadrant
			);

			addRow(
				"Participation fédéraux",
				person.federaux ||
				person.participationFederaux
			);

			addRow(
				"Rôle fédéraux",
				person.federauxRole
			);

			addRow(
				"Discipline",
				person.federauxDiscipline
			);

			addRow(
				"Licence ESF / FFS / FIS",
				person.federauxLicence
			);

			addRow(
				"Catégorie course",
				person.federauxCategorie
			);


			// =====================================================
			// CONTACT URGENCE
			// =====================================================

			addSectionTitle(
				"Contact d'urgence",
				"🚨"
			);

			addRow(
				"Nom",
				person.nomUrgence ||
				person.contactUrgence
			);

			addRow(
				"Prénom",
				person.prenomUrgence
			);

			addRow(
				"Téléphone",
				person.telephoneUrgence
			);

			addRow(
				"Lien",
				person.lien
			);


			// =====================================================
			// INFORMATIONS MÉDICALES
			// =====================================================

			addSectionTitle(
				"Informations médicales",
				"🩺"
			);

			addRow(
				"Allergies",
				person.allergies
			);

			addRow(
				"Traitement",
				person.traitement
			);

			addRow(
				"Détails traitement",
				person.detailsTraitement
			);

			addRow(
				"Antécédents",
				person.antecedents
			);

			addRow(
				"Recommandations",
				person.recommandations
			);

			addRow(
				"Groupe sanguin",
				person.groupeSanguin
			);

			addRow(
				"Médecin",
				person.medecin
			);


			// =====================================================
			// LOCATION
			// =====================================================

			addSectionTitle(
				"Location matériel",
				"🎿"
			);

			addRow(
				"Location",
				person.materiel
			);

			addRow(
				"Pack",
				person.pack
			);

			addRow(
				"Taille",
				person.locTaille
			);

			addRow(
				"Poids",
				person.locPoids
			);

			addRow(
				"Pointure",
				person.locPointure
			);


			// =====================================================
			// DROIT À L'IMAGE
			// =====================================================

			addSectionTitle(
				"Droit à l'image",
				"📸"
			);

			addRow(
				"Accord",
				person.droitImage ||
				person.droitImageAccord
			);


			// =====================================================
			// PAIEMENT
			// =====================================================

			addSectionTitle(
				"Paiement",
				"💳"
			);

			addRow(
				"Type",
				typeParticipant
			);

			addRow(
				"Statut",
				person.safranStatus ||
				person.statutSafran ||
				person.safran
			);

			addRow(
				"Forfait Luz Ardiden",
				forfaitLuz
					? "Oui"
					: "Non"
			);

			addRow(
				"Cotisation",
				tarif
					? `${tarif.cotisation} €`
					: "-"
			);

			addRow(
				"Forfait Luz",
				forfaitLuz && tarif
					? `${tarif.forfaitLuz} €`
					: "0 €"
			);

			addRow(
				"Montant total",
				`${montantTotal} €`
			);

			addRow(
				"Moyen de paiement",
				person.paiement ||
				person.moyenPaiement ||
				person.locPaiement
			);

			addRow(
				"Nombre de chèques",
				person.nbCheques
			);

			addRow(
				"Banque",
				person.banqueCheque ||
				person.banque
			);


			// =====================================================
			// DOCUMENTS
			// =====================================================

			addSectionTitle(
				"Documents",
				"📎"
			);

			addRow(
				"Pièce d'identité",
				person.pieceIdentite
					? "Fournie"
					: "À fournir"
			);

			addRow(
				"Photo d'identité",
				person.photoIdentite
					? "Fournie"
					: "À fournir"
			);

			addRow(
				"Certificat scolaire",
				person.certificatScolaire
					? "Fourni"
					: "À fournir"
			);

			addRow(
				"Inscription SAFRAN",
				person.inscriptionSafran
					? "Fournie"
					: "À fournir"
			);


			// =====================================================
			// RÉSUMÉ FINAL
			// =====================================================

			checkPageSpace(35);

			y += 4;

			pdf.setFillColor(
				24,
				45,
				70
			);

			pdf.roundedRect(
				MARGIN_LEFT,
				y,
				CONTENT_WIDTH,
				27,
				3,
				3,
				"F"
			);

			pdf.setTextColor(
				255,
				255,
				255
			);

			pdf.setFont(
				"helvetica",
				"bold"
			);

			pdf.setFontSize(10);

			pdf.text(
				"RÉCAPITULATIF DE L'INSCRIPTION",
				MARGIN_LEFT + 5,
				y + 7
			);

			pdf.setFont(
				"helvetica",
				"normal"
			);

			pdf.setFontSize(9);

			pdf.text(
				`${person.prenom || ""} ${person.nom || ""}`,
				MARGIN_LEFT + 5,
				y + 14
			);

			pdf.text(
				`${typeParticipant} • ${safe(person.safranStatus || person.statutSafran || person.safran)}`,
				MARGIN_LEFT + 5,
				y + 20
			);

			pdf.setFont(
				"helvetica",
				"bold"
			);

			pdf.setFontSize(14);

			pdf.text(
				`${montantTotal} €`,
				PAGE_WIDTH - MARGIN_RIGHT - 5,
				y + 16,
				{
					align: "right"
				}
			);

			y += 34;


			// =====================================================
			// PIED DE PAGE
			// =====================================================

			addFooter();


			// =====================================================
			// SAUVEGARDE
			// =====================================================

			const nomFichier =
				`${person.nom || "participant"}_${person.prenom || ""}`
				.replace(/\s+/g, "_")
				.replace(/[^\wÀ-ÿ_-]/g, "");

			pdf.save(
				`${nomFichier}_ASCT.pdf`
			);

		});
		
		const details =
			card.querySelector(".details");

		card.addEventListener("click", (e) => {

			if(
				e.target.classList.contains("delete")
				||
				e.target.classList.contains("pdf")
			){
				return;
			}

			details.classList.toggle("active");
		});

        liste.appendChild(card);

    });
}

// =========================
// FIRESTORE LIVE
// =========================

onSnapshot(
    collection(db, "inscriptions"),
    (snapshot) => {

        allData = [];

        snapshot.forEach(docSnap => {

            allData.push({
                id: docSnap.id,
                ...docSnap.data()
            });
        });

        afficherListe(allData);
    }
);

// =========================
// RECHERCHE
// =========================

searchInput.addEventListener("input", () => {

    const value =
        searchInput.value.toLowerCase();

    const filtered = allData.filter(person => {

        return (

            (person.nom || "")
            .toLowerCase()
            .includes(value)

            ||

            (person.prenom || "")
            .toLowerCase()
            .includes(value)

            ||

            (person.email || "")
            .toLowerCase()
            .includes(value)

        );
    });

    afficherListe(filtered);
});

// =========================
// EXPORT PDF GLOBAL
// =========================

exportPDF.addEventListener("click", () => {

    const { jsPDF } = window.jspdf;

    const pdf = new jsPDF();

    let y = 20;

    pdf.setFontSize(18);

    pdf.text(
        "Liste des inscriptions ASCT",
        20,
        y
    );

    y += 20;

    allData.forEach(person => {

        pdf.setFontSize(12);

        pdf.text(
            `${person.prenom} ${person.nom}`,
            20,
            y
        );

        pdf.text(
            `${person.email || "-"}`,
            90,
            y
        );

        y += 10;

        if(y > 270){

            pdf.addPage();

            y = 20;
        }
    });

    pdf.save("inscriptions_ASCT.pdf");
});

// =========================
// EXPORT CSV
// =========================

exportCSV.addEventListener("click", () => {

    let csv =
        "Nom;Prenom;Email;Telephone\n";

    allData.forEach(person => {

        csv +=
            `${person.nom || ""};`
            + `${person.prenom || ""};`
            + `${person.email || ""};`
            + `${person.telephone || ""}\n`;
    });

    const blob =
        new Blob([csv], {
            type:"text/csv"
        });

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    a.href = url;

    a.download = "inscriptions.csv";

    a.click();
});

</script>
