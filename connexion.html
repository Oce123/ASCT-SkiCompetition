<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Espace adhérent — ASCT Ski Compétition</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #f4f7fb, #e8eef6);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #1d2a3a;
        }

        .login-container {
            width: 100%;
            max-width: 460px;
        }

        .logo {
            display: block;
            width: 110px;
            height: 110px;
            object-fit: contain;
            margin: 0 auto 20px;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.10);
        }

        h1 {
            text-align: center;
            margin: 0 0 8px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #687789;
            margin: 0 0 30px;
            line-height: 1.5;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d6dde6;
            border-radius: 9px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: #1d5fa7;
            box-shadow: 0 0 0 3px rgba(29, 95, 167, 0.12);
        }

        button {
            width: 100%;
            border: none;
            border-radius: 9px;
            padding: 14px;
            background: #1d5fa7;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background: #174d89;
        }

        button:active {
            transform: scale(0.99);
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .message {
            display: none;
            margin-top: 18px;
            padding: 12px 14px;
            border-radius: 9px;
            font-size: 14px;
            line-height: 1.4;
        }

        .message.error {
            display: block;
            background: #fff0f0;
            color: #a42626;
            border: 1px solid #f0c5c5;
        }

        .message.success {
            display: block;
            background: #eefaf1;
            color: #23733a;
            border: 1px solid #c6e7ce;
        }

        .create-account {
            text-align: center;
            margin-top: 25px;
            padding-top: 25px;
            border-top: 1px solid #e5e9ee;
        }

        .create-account p {
            margin: 0 0 12px;
            color: #687789;
        }

        .create-account a {
            color: #1d5fa7;
            font-weight: 700;
            text-decoration: none;
        }

        .create-account a:hover {
            text-decoration: underline;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #687789;
            text-decoration: none;
            font-size: 14px;
        }

        .back:hover {
            color: #1d5fa7;
        }
    </style>
</head>

<body>

<div class="login-container">

    <!-- Si ton logo porte un autre nom, adapte simplement cette ligne -->
    <img src="logo.png" alt="ASCT Ski Compétition" class="logo">

    <div class="card">

        <h1>Espace adhérent</h1>

        <p class="subtitle">
            Connectez-vous à votre espace famille pour retrouver
            vos inscriptions et vos informations.
        </p>

        <form id="login-form">

            <div class="field">
                <label for="email">Adresse e-mail</label>
                <input
                    type="email"
                    id="email"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="field">
                <label for="password">Mot de passe</label>
                <input
                    type="password"
                    id="password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit" id="login-button">
                Se connecter
            </button>

        </form>

        <div id="message" class="message"></div>

        <div class="create-account">
            <p>Vous n'avez pas encore de compte ?</p>

            <a href="compte.html">
                Créer mon espace famille
            </a>
        </div>

    </div>

    <a href="index.html" class="back">
        ← Retour à l'accueil
    </a>

</div>


<script type="module">

    import { initializeApp } 
        from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";

    import {
        getAuth,
        signInWithEmailAndPassword
    } 
        from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";


    const firebaseConfig = {
	  apiKey: "AIzaSyD_xW5F5iRRXHRuolefgfsN--f-lWMB-9A",
	  authDomain: "asct-ski.firebaseapp.com",
	  projectId: "asct-ski",
	  storageBucket: "asct-ski.firebasestorage.app",
	  messagingSenderId: "845391150142",
	  appId: "1:845391150142:web:c7d808016344cfafad256f"
	};


    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);


    const form = document.getElementById("login-form");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const button = document.getElementById("login-button");
    const message = document.getElementById("message");


    function afficherMessage(texte, type) {
        message.textContent = texte;
        message.className = "message " + type;
    }


    form.addEventListener("submit", async (event) => {

        event.preventDefault();

        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (!email || !password) {
            afficherMessage(
                "Veuillez renseigner votre adresse e-mail et votre mot de passe.",
                "error"
            );
            return;
        }

        button.disabled = true;
        button.textContent = "Connexion…";
        message.className = "message";


        try {

            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );

            afficherMessage(
                "Connexion réussie. Redirection…",
                "success"
            );

            window.location.href = "espace-adherent.html";

        } catch (error) {

            console.error(error);

            let texte = "Impossible de vous connecter.";

            if (
                error.code === "auth/invalid-credential" ||
                error.code === "auth/wrong-password" ||
                error.code === "auth/user-not-found"
            ) {
                texte = "Adresse e-mail ou mot de passe incorrect.";
            }

            if (error.code === "auth/invalid-email") {
                texte = "L'adresse e-mail renseignée n'est pas valide.";
            }

            if (error.code === "auth/too-many-requests") {
                texte = "Trop de tentatives. Veuillez patienter quelques instants.";
            }

            afficherMessage(texte, "error");

        } finally {

            button.disabled = false;
            button.textContent = "Se connecter";

        }

    });

</script>

</body>
</html>
